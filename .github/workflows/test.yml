name: Lint, type-check and build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run TypeScript check for backend
        run: npm run ts-check-backend

      - name: Run TypeScript check for windows
        run: npm run ts-check-windows

      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build Electron app
        run: npm run build
