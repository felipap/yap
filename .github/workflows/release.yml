name: Build and Release
permissions:
  contents: write

on:
  push:
    tags:
      - '*.*.*' # Only trigger on version tags like 1.0.0

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      CSC_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Xcode Command Line Tools
        run: xcode-select --install || true

      - name: Build Electron app
        run: npm run build

      - name: Package Electron app
        run: npm run pack

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 'Yap Camera ${{ github.ref_name }}'
          files: |
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/*.app
            dist-electron/latest-mac.yml
          draft: false
          generate_release_notes: true
          body: |
            ## Download

            | Platform | Download |
            |----------|----------|
            | **macOS** (Apple Silicon - M1/M2/M3/M4) | [Yap-${{ github.ref_name }}-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yap-${{ github.ref_name }}-arm64.dmg) |
            | **macOS** (Intel) | [Yap-${{ github.ref_name }}-x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yap-${{ github.ref_name }}-x64.dmg) |
            | **Windows** | [Yap-${{ github.ref_name }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yap-${{ github.ref_name }}.exe) |
            | **Linux** | [Yap-${{ github.ref_name }}.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yap-${{ github.ref_name }}.AppImage) |

            > **Not sure which Mac you have?** Click  → About This Mac. If it says "Apple M1/M2/M3/M4", download the Apple Silicon version.

            ---
